<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">03  Claim 与 Lease：从负责到有效执行</title>
<desc id="desc">五步时间线：认领、获取租约、续租、到期重新判断、合格接管。续租不改变归属与范围。接管不是到期自动发生，租约只保护接入 fencing 的路径。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10Z" fill="#0070f3"/>
</marker>
</defs>
<g font-family="Geist, Inter, Helvetica Neue, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="0" y="0" width="1000" height="720" rx="0" fill="#fafafa" stroke="none"/>
<text x="40" y="49" font-size="28" fill="#171717" font-weight="600">03  Claim 与 Lease：从负责到有效执行</text>
<text x="40" y="84" font-size="18" fill="#4d4d4d" font-weight="400">Claim 表示责任；Lease 进一步约束执行。以下仅说明已具备相应资格的租约路径。</text>
<path d="M64 146 L64 539" stroke="#b8d5fc" stroke-width="3"/>
<rect x="98" y="116" width="862" height="76" rx="12" fill="#fff" stroke="#ebebeb"/>
<circle cx="64" cy="150" r="18" fill="#0070f3"/>
<text x="58" y="157" font-size="20" fill="#fff" font-weight="600">1</text>
<text x="120" y="145" font-size="22" fill="#171717" font-weight="600">认领工作</text>
<text x="120" y="173" font-size="18" fill="#4d4d4d" font-weight="400">Agent A 成为 Todo 的负责人；单凭 claim 不证明进程活着。</text>
<rect x="98" y="206" width="862" height="76" rx="12" fill="#fff" stroke="#ebebeb"/>
<circle cx="64" cy="240" r="18" fill="#0070f3"/>
<text x="58" y="247" font-size="20" fill="#fff" font-weight="600">2</text>
<text x="120" y="235" font-size="22" fill="#171717" font-weight="600">取得有效租约</text>
<text x="120" y="263" font-size="18" fill="#4d4d4d" font-weight="400">执行实例 A 持有当前租约：期限、版本、epoch 与限定写入范围。</text>
<rect x="98" y="296" width="862" height="76" rx="12" fill="#fff" stroke="#ebebeb"/>
<circle cx="64" cy="330" r="18" fill="#0070f3"/>
<text x="58" y="337" font-size="20" fill="#fff" font-weight="600">3</text>
<text x="120" y="325" font-size="22" fill="#171717" font-weight="600">在到期前续租</text>
<text x="120" y="353" font-size="18" fill="#4d4d4d" font-weight="400">校验持有者与预期版本；推进版本和期限，保留归属与范围。</text>
<rect x="98" y="386" width="862" height="76" rx="12" fill="#fff" stroke="#ebebeb"/>
<circle cx="64" cy="420" r="18" fill="#0070f3"/>
<text x="58" y="427" font-size="20" fill="#fff" font-weight="600">4</text>
<text x="120" y="415" font-size="22" fill="#171717" font-weight="600">到期后重新判定</text>
<text x="120" y="443" font-size="18" fill="#4d4d4d" font-weight="400">到期不杀死进程；先检查宽限、准入和恢复条件，再决定是否接管。</text>
<rect x="98" y="476" width="862" height="76" rx="12" fill="#fff" stroke="#ebebeb"/>
<circle cx="64" cy="510" r="18" fill="#0070f3"/>
<text x="58" y="517" font-size="20" fill="#fff" font-weight="600">5</text>
<text x="120" y="505" font-size="22" fill="#171717" font-weight="600">合格接管后再执行</text>
<text x="120" y="533" font-size="18" fill="#4d4d4d" font-weight="400">新执行实例使用新的租约身份；旧 epoch 的受保护写入被拒绝。</text>
<rect x="40" y="592" width="920" height="64" rx="12" fill="#f3f8ff" stroke="#b8d5fc"/>
<text x="60" y="617" font-size="19" fill="#0070f3" font-weight="600">历史回执 ≠ 当前租约       有效租约 ≠ 发布授权       Fencing ≠ 外部效果恰好一次</text>
<text x="60" y="642" font-size="17" fill="#4d4d4d" font-weight="400">继续行动前读取当前事实；外部进程与副作用仍由对应 Runtime 和系统约束。</text>
<text x="40" y="691" font-size="15" fill="#4d4d4d" font-weight="400">LOOPX  /  看板基础 · 合成示例</text>
</g>
</svg>
