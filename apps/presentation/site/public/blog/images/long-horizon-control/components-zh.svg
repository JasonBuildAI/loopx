  <polyline font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="none" stroke="#77818d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="955,434 962,440 955,446" />
  <polyline font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="none" stroke="#77818d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="1060,494 1060,660 760,660" />
  <polyline font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="none" stroke="#77818d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="767,654 760,660 767,666" />
  <polyline font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="none" stroke="#77818d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="480,660 352,660" />
  <polyline font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="none" stroke="#77818d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="359,654 352,660 359,666" />
  <polyline font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="none" stroke="#77818d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="264,582 264,548 406,548 406,478 480,478" />
