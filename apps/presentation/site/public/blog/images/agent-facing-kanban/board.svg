<text x="374" y="148" font-size="22" fill="#171717" font-weight="600">等待决定</text>
<text x="688" y="148" font-size="22" fill="#171717" font-weight="600">已有结果</text>
<rect x="52" y="170" width="268" height="222" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="70" y="202" font-size="21" fill="#171717" font-weight="600">C · 集成验证</text>
<text x="70" y="237" font-size="17" fill="#4d4d4d" font-weight="400">负责人：验证 Agent</text>
<text x="70" y="266" font-size="17" fill="#4d4d4d" font-weight="400">Claim：已认领</text>
<text x="70" y="295" font-size="17" fill="#4d4d4d" font-weight="400">Lease：有效（本例启用）</text>
