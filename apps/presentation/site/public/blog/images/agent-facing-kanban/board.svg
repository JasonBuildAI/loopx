<text x="70" y="353" font-size="17" fill="#4d4d4d" font-weight="400">下一步：回写结果与证据</text>
<rect x="52" y="408" width="268" height="100" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="70" y="439" font-size="19" fill="#171717" font-weight="600">监控 · 验证任务结果</text>
<text x="70" y="468" font-size="17" fill="#4d4d4d" font-weight="400">到期观察；无变化则安静</text>
<rect x="366" y="170" width="268" height="222" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="384" y="202" font-size="21" fill="#171717" font-weight="600">D · 发布候选版本</text>
<text x="384" y="237" font-size="17" fill="#4d4d4d" font-weight="400">发布 Gate：未确认</text>
<text x="384" y="266" font-size="17" fill="#4d4d4d" font-weight="400">作用范围：发布决定</text>
<text x="384" y="295" font-size="17" fill="#4d4d4d" font-weight="400">前置事实：验收通过</text>
<text x="384" y="324" font-size="17" fill="#4d4d4d" font-weight="400">下一步：满足条件后发布</text>
