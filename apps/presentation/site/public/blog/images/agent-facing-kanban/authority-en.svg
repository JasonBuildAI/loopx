<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">04  Shared authority state: which facts count?</title>
<desc id="desc">CLI, frontend, and Lark use existing entry points. A typed lifecycle owner validates operations against the selected authority source. Unpromoted and canonical state remain distinct. File, SQLite, and PostgreSQL are alternatives that qualify separately. Receipts and read-only projections sit downstream.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10Z" fill="#0070f3"/>
</marker>
</defs>
<g font-family="Geist, Inter, Helvetica Neue, Arial, sans-serif">
<rect x="0" y="0" width="1000" height="720" rx="0" fill="#fafafa" stroke="none"/>
<text x="40" y="49" font-size="28" fill="#171717" font-weight="600">04  Shared authority state: which facts count?</text>
<text x="40" y="84" font-size="18" fill="#4d4d4d" font-weight="400">Entry points may differ; every write must know which rules and current state it follows.</text>
<rect x="40" y="111" width="292" height="79" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="60" y="142" font-size="23" fill="#171717" font-weight="600">CLI</text>
<text x="60" y="172" font-size="17" fill="#4d4d4d" font-weight="400">Commands and structured readback</text>
<rect x="354" y="111" width="292" height="79" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="374" y="142" font-size="23" fill="#171717" font-weight="600">Frontend</text>
<text x="374" y="172" font-size="17" fill="#4d4d4d" font-weight="400">Board and details</text>
<rect x="668" y="111" width="292" height="79" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="688" y="142" font-size="23" fill="#171717" font-weight="600">Lark</text>
<text x="688" y="172" font-size="17" fill="#4d4d4d" font-weight="400">Messages / configured adapters</text>
<path d="M500 190 L500 214" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="224" width="920" height="92" rx="12" fill="#f3f8ff" stroke="#b8d5fc"/>
<text x="64" y="259" font-size="23" fill="#171717" font-weight="600">Typed lifecycle owner · Receive and validate legal operations</text>
<text x="64" y="290" font-size="19" fill="#4d4d4d" font-weight="400">Identity + authority → current version + preconditions → commit / reject → receipt</text>
<path d="M500 316 L500 340" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="350" width="920" height="167" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="64" y="384" font-size="22" fill="#171717" font-weight="600">The Goal's provider selection and promotion state determine authority</text>
<text x="64" y="416" font-size="18" fill="#4d4d4d" font-weight="400">Unpromoted: existing Markdown / local-writer rules</text>
<text x="64" y="448" font-size="18" fill="#4d4d4d" font-weight="400">Canonical path: the selected provider owns its transactions</text>
<rect x="64" y="463" width="262" height="36" rx="12" fill="#fafafa" stroke="#ebebeb"/>
<text x="82" y="488" font-size="17" fill="#171717" font-weight="400">File  ·  qualify separately</text>
<rect x="351" y="463" width="262" height="36" rx="12" fill="#fafafa" stroke="#ebebeb"/>
<text x="369" y="488" font-size="17" fill="#171717" font-weight="400">SQLite  ·  qualify separately</text>
<rect x="638" y="463" width="262" height="36" rx="12" fill="#fafafa" stroke="#ebebeb"/>
<text x="656" y="488" font-size="17" fill="#171717" font-weight="400">PostgreSQL  ·  qualify separately</text>
<path d="M500 517 L500 541" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="551" width="920" height="74" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="64" y="582" font-size="22" fill="#171717" font-weight="600">Receipts + read-only projections · state / board / bounded evidence timeline</text>
<text x="64" y="609" font-size="18" fill="#4d4d4d" font-weight="400">Projections retain source and identity; provider failure does not silently create another writer.</text>
<text x="40" y="656" font-size="18" fill="#4d4d4d" font-weight="400">Selecting a provider does not promote a Goal; these are alternatives, not parallel primary stores.</text>
<text x="40" y="691" font-size="15" fill="#4d4d4d" font-weight="400">LOOPX  /  KANBAN FOUNDATIONS · SYNTHETIC EXAMPLE</text>
</g>
</svg>
