  <text font-family="Noto Sans SC" fill="#1f2329" x="44" y="966" font-size="17" font-weight="600">The control plane governs and records actions; agents choose, reason and execute within bounds.</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="44" y="996" font-size="15">Responsibilities and information flow: domains retain state ownership. No single database, global transaction or fixed call order is implied.</text>
