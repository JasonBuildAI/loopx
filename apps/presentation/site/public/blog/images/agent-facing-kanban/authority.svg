<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">04  Shared Authority State：哪份事实算数</title>
<desc id="desc">CLI、前端和 Lark 使用已有入口，经 typed lifecycle owner 校验后读写所选权威来源。未迁移与 canonical 状态分别处理。File、SQLite、PostgreSQL 是各自需要验收的替代选项。下游是回执和只读投影。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10Z" fill="#0070f3"/>
</marker>
</defs>
<g font-family="Geist, Inter, Helvetica Neue, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="0" y="0" width="1000" height="720" rx="0" fill="#fafafa" stroke="none"/>
<text x="40" y="49" font-size="28" fill="#171717" font-weight="600">04  Shared Authority State：哪份事实算数</text>
<text x="40" y="84" font-size="18" fill="#4d4d4d" font-weight="400">入口可以不同；每次写入都必须知道自己服从哪套规则、哪份当前状态。</text>
<rect x="40" y="111" width="292" height="79" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="60" y="142" font-size="23" fill="#171717" font-weight="600">CLI</text>
<text x="60" y="172" font-size="17" fill="#4d4d4d" font-weight="400">命令与结构化读回</text>
<rect x="354" y="111" width="292" height="79" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="374" y="142" font-size="23" fill="#171717" font-weight="600">Frontend</text>
<text x="374" y="172" font-size="17" fill="#4d4d4d" font-weight="400">看板与详情</text>
<rect x="668" y="111" width="292" height="79" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="688" y="142" font-size="23" fill="#171717" font-weight="600">Lark</text>
<text x="688" y="172" font-size="17" fill="#4d4d4d" font-weight="400">消息 / 配置后的适配</text>
<path d="M500 190 L500 214" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="224" width="920" height="92" rx="12" fill="#f3f8ff" stroke="#b8d5fc"/>
<text x="64" y="259" font-size="23" fill="#171717" font-weight="600">Typed lifecycle owner · 接收并验证合法操作</text>
<text x="64" y="290" font-size="19" fill="#4d4d4d" font-weight="400">身份与权限 → 当前版本与前置条件 → 状态提交 / 拒绝 → 操作回执</text>
<path d="M500 316 L500 340" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="350" width="920" height="167" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="64" y="384" font-size="22" fill="#171717" font-weight="600">由 Goal 的 provider 选择与 promotion 状态决定权威来源</text>
<text x="64" y="416" font-size="18" fill="#4d4d4d" font-weight="400">尚未迁移：已有 Markdown / 本地 writer 规则</text>
<text x="64" y="448" font-size="18" fill="#4d4d4d" font-weight="400">Canonical 路径：选中的 provider 承担相应事务</text>
<rect x="64" y="463" width="262" height="36" rx="12" fill="#fafafa" stroke="#ebebeb"/>
<text x="82" y="488" font-size="17" fill="#171717" font-weight="400">File  ·  分别验收</text>
<rect x="351" y="463" width="262" height="36" rx="12" fill="#fafafa" stroke="#ebebeb"/>
<text x="369" y="488" font-size="17" fill="#171717" font-weight="400">SQLite  ·  分别验收</text>
<rect x="638" y="463" width="262" height="36" rx="12" fill="#fafafa" stroke="#ebebeb"/>
<text x="656" y="488" font-size="17" fill="#171717" font-weight="400">PostgreSQL  ·  分别验收</text>
<path d="M500 517 L500 541" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="551" width="920" height="74" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="64" y="582" font-size="22" fill="#171717" font-weight="600">回执与只读投影 · 当前状态 / 看板 / 有界证据时间线</text>
<text x="64" y="609" font-size="18" fill="#4d4d4d" font-weight="400">投影保留来源与身份；provider 失败不悄悄回退成另一个 writer。</text>
<text x="40" y="656" font-size="18" fill="#4d4d4d" font-weight="400">选择 provider 不等于迁移 Goal；三个 provider 是配置选项，不是三个并行主库。</text>
<text x="40" y="691" font-size="15" fill="#4d4d4d" font-weight="400">LOOPX  /  看板基础 · 合成示例</text>
</g>
</svg>
