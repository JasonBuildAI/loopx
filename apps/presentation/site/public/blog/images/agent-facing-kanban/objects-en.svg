<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">01  One board, several different questions</title>
<desc id="desc">A Goal defines the outcome and acceptance, while Todos organize work. Claims express ownership, leases constrain execution, gates capture decisions, dependencies capture prerequisite facts, evidence supports judgment, lanes organize views, and authority state determines which facts count.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10Z" fill="#0070f3"/>
</marker>
</defs>
<g font-family="Geist, Inter, Helvetica Neue, Arial, sans-serif">
<rect x="0" y="0" width="1000" height="720" rx="0" fill="#fafafa" stroke="none"/>
<text x="40" y="49" font-size="28" fill="#171717" font-weight="600">01  One board, several different questions</text>
<text x="40" y="83" font-size="18" fill="#4d4d4d" font-weight="400">Read from outcomes, work, and constraints through to shared facts.</text>
<rect x="40" y="112" width="920" height="82" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="64" y="145" font-size="23" fill="#171717" font-weight="600">Goal · Deliver a usable bulk export</text>
<text x="64" y="174" font-size="18" fill="#4d4d4d" font-weight="400">Acceptance · Works at scale, isolates permissions, and ships only after confirmation</text>
<path d="M500 194 L500 228" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="238" width="280" height="162" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="64" y="273" font-size="22" fill="#171717" font-weight="600">Claim · Who owns it?</text>
<text x="64" y="307" font-size="18" fill="#4d4d4d" font-weight="400">Dev agent claims the work</text>
<text x="64" y="349" font-size="22" fill="#171717" font-weight="600">Lease · Which run is valid?</text>
<text x="64" y="381" font-size="18" fill="#4d4d4d" font-weight="400">Optional: expiry, version, scope</text>
<rect x="350" y="238" width="300" height="162" rx="12" fill="#f3f8ff" stroke="#b8d5fc"/>
<text x="374" y="273" font-size="22" fill="#171717" font-weight="600">Todo · Deliverable work</text>
<text x="374" y="309" font-size="18" fill="#4d4d4d" font-weight="400">Build export + permission test</text>
<text x="374" y="337" font-size="18" fill="#4d4d4d" font-weight="400">Stable id · state · next step</text>
<text x="374" y="365" font-size="18" fill="#4d4d4d" font-weight="400">Recheck Goal after completion</text>
<rect x="680" y="238" width="280" height="162" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="704" y="273" font-size="22" fill="#171717" font-weight="600">Gate · Which decision?</text>
<text x="704" y="307" font-size="18" fill="#4d4d4d" font-weight="400">Owner confirms release</text>
<text x="704" y="335" font-size="18" fill="#4d4d4d" font-weight="600">Dependency · Which fact?</text>
<text x="704" y="363" font-size="18" fill="#4d4d4d" font-weight="400">Example: review passed</text>
<path d="M320 317 L349 317" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680 317 L651 317" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M500 400 L500 433" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="444" width="440" height="102" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="64" y="479" font-size="22" fill="#171717" font-weight="600">Evidence · Why believe it?</text>
<text x="64" y="511" font-size="18" fill="#4d4d4d" font-weight="400">Tests, review, and artifacts for revision A</text>
<rect x="500" y="444" width="460" height="102" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="524" y="479" font-size="22" fill="#171717" font-weight="600">Lane · How do I read it?</text>
<text x="524" y="511" font-size="18" fill="#4d4d4d" font-weight="400">Runnable / waiting / monitor / owned elsewhere</text>
<rect x="40" y="582" width="920" height="64" rx="12" fill="#171717" stroke="#171717"/>
<text x="64" y="611" font-size="22" fill="#fff" font-weight="600">Shared authority state · The accepted facts and write rules</text>
<text x="64" y="635" font-size="17" fill="#ededed" font-weight="400">The board reads and expands these facts; display columns do not grant authority.</text>
<text x="40" y="691" font-size="15" fill="#4d4d4d" font-weight="400">LOOPX  /  KANBAN FOUNDATIONS · SYNTHETIC EXAMPLE</text>
</g>
</svg>
