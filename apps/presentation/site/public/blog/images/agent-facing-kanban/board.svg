<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">02  用一张板读懂当前局面</title>
<desc id="desc">合成看板：集成验证已认领且有运行证据；发布等待有范围的 Gate；实现与评审已有结果。Goal 尚未完成。列是解释性投影，不是持久化状态枚举。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10Z" fill="#0070f3"/>
</marker>
</defs>
<g font-family="Geist, Inter, Helvetica Neue, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="0" y="0" width="1000" height="720" rx="0" fill="#fafafa" stroke="none"/>
<text x="40" y="49" font-size="28" fill="#171717" font-weight="600">02  用一张板读懂当前局面</text>
<text x="40" y="84" font-size="18" fill="#4d4d4d" font-weight="400">Goal · 安全交付批量导出    /    当前还缺：大数据量验证、发布确认</text>
<rect x="40" y="112" width="292" height="414" rx="12" fill="#f2f2f2" stroke="#ebebeb"/>
<rect x="354" y="112" width="292" height="414" rx="12" fill="#f2f2f2" stroke="#ebebeb"/>
<rect x="668" y="112" width="292" height="414" rx="12" fill="#f2f2f2" stroke="#ebebeb"/>
