<text x="698" y="375" font-size="21" fill="#171717" font-weight="600">B · 独立评审</text>
<text x="698" y="410" font-size="17" fill="#4d4d4d" font-weight="400">负责人：评审 Agent</text>
<text x="698" y="438" font-size="17" fill="#4d4d4d" font-weight="400">证据：修订 A 评审通过</text>
<text x="698" y="466" font-size="17" fill="#4d4d4d" font-weight="400">后继：C 集成验证</text>
<text x="40" y="565" font-size="22" fill="#171717" font-weight="600">同一份 Todo，按不同 Agent 的资格和责任呈现。</text>
<text x="40" y="601" font-size="18" fill="#4d4d4d" font-weight="400">列名仅作解释，不是持久化状态枚举。已认领不等于执行中；运行需要自己的证据。</text>
<text x="40" y="631" font-size="18" fill="#4d4d4d" font-weight="400">单张卡片 done，也不等于 Goal 已验收。</text>
<text x="40" y="691" font-size="15" fill="#4d4d4d" font-weight="400">LOOPX  /  看板基础 · 合成示例</text>
