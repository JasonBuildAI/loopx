<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">01  一张看板，几种不同的问题</title>
<desc id="desc">Goal 定义结果与验收，Todo 组织工作。Claim 表示归属，Lease 约束执行，Gate 表示决定，依赖表示前置事实。Evidence 支撑判断，Lane 组织视图，权威状态决定事实。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10Z" fill="#0070f3"/>
</marker>
</defs>
<g font-family="Geist, Inter, Helvetica Neue, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="0" y="0" width="1000" height="720" rx="0" fill="#fafafa" stroke="none"/>
<text x="40" y="49" font-size="28" fill="#171717" font-weight="600">01  一张看板，几种不同的问题</text>
<text x="40" y="83" font-size="18" fill="#4d4d4d" font-weight="400">从结果、工作和约束，读到共同事实。</text>
<rect x="40" y="112" width="920" height="82" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="64" y="145" font-size="23" fill="#171717" font-weight="600">Goal · 交付可用的批量导出</text>
<text x="64" y="174" font-size="18" fill="#4d4d4d" font-weight="400">Acceptance · 大数据量可用，权限隔离通过，发布经过确认</text>
<path d="M500 194 L500 228" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="238" width="280" height="162" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="64" y="273" font-size="22" fill="#171717" font-weight="600">Claim · 谁负责</text>
<text x="64" y="307" font-size="18" fill="#4d4d4d" font-weight="400">开发 Agent 认领实现</text>
<text x="64" y="349" font-size="22" fill="#171717" font-weight="600">Lease · 哪次执行有效</text>
<text x="64" y="381" font-size="18" fill="#4d4d4d" font-weight="400">可选：期限、版本、写入范围</text>
<rect x="350" y="238" width="300" height="162" rx="12" fill="#f3f8ff" stroke="#b8d5fc"/>
<text x="374" y="273" font-size="22" fill="#171717" font-weight="600">Todo · 一块可交付工作</text>
<text x="374" y="309" font-size="18" fill="#4d4d4d" font-weight="400">实现导出与权限负例</text>
<text x="374" y="337" font-size="18" fill="#4d4d4d" font-weight="400">稳定身份 · 当前状态 · 下一步</text>
<text x="374" y="365" font-size="18" fill="#4d4d4d" font-weight="400">完成后回看 Goal 的验收缺口</text>
<rect x="680" y="238" width="280" height="162" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="704" y="273" font-size="22" fill="#171717" font-weight="600">Gate · 还缺什么决定</text>
<text x="704" y="307" font-size="18" fill="#4d4d4d" font-weight="400">发布前由 Owner 确认</text>
<text x="704" y="335" font-size="18" fill="#4d4d4d" font-weight="400">Dependency · 前置事实</text>
<text x="704" y="363" font-size="18" fill="#4d4d4d" font-weight="400">例如：评审已通过</text>
<path d="M320 317 L349 317" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680 317 L651 317" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M500 400 L500 433" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="444" width="440" height="102" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="64" y="479" font-size="22" fill="#171717" font-weight="600">Evidence · 凭什么判断</text>
<text x="64" y="511" font-size="18" fill="#4d4d4d" font-weight="400">修订 A 的测试、评审与产物引用</text>
<rect x="500" y="444" width="460" height="102" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="524" y="479" font-size="22" fill="#171717" font-weight="600">Lane · 当前视角怎样读</text>
<text x="524" y="511" font-size="18" fill="#4d4d4d" font-weight="400">可推进 / 等决定 / 监控到期 / 他人负责</text>
<rect x="40" y="582" width="920" height="64" rx="12" fill="#171717" stroke="#171717"/>
<text x="64" y="611" font-size="22" fill="#fff" font-weight="600">Shared Authority State · 共同遵守的权威状态与写入规则</text>
<text x="64" y="635" font-size="17" fill="#ededed" font-weight="400">看板读取并展开这些事实；展示列本身不授予权限。</text>
<text x="40" y="691" font-size="15" fill="#4d4d4d" font-weight="400">LOOPX  /  看板基础 · 合成示例</text>
</g>
</svg>
