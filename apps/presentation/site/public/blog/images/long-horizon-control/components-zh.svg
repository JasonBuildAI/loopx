  <polyline font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="none" stroke="#77818d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="320,434 480,434" />
  <polyline font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="none" stroke="#77818d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="473,428 480,434 473,440" />
