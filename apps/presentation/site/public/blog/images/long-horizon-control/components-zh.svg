  <polyline font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="none" stroke="#77818d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="373,820 380,826 373,832" />
  <polyline font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="none" stroke="#77818d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="790,826 1060,826 1060,732" />
  <polyline font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="none" stroke="#77818d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="1054,739 1060,732 1066,739" />
  <path font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#ffffff" d="M76 198 H290 L316 224 V298 H76 Z" stroke="#7d8792" stroke-width="1.5" />
  <polyline font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="none" points="290,198 290,224 316,224" stroke="#7d8792" stroke-width="1.5" />
  <text font-family="Noto Sans SC" fill="#1f2329" x="96" y="237" font-size="21" font-weight="600">Goal / Acceptance</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="96" y="272" font-size="17">目标是什么，怎样才算完成</text>
  <rect font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#f5f8ff" x="350" y="198" width="272" height="100" rx="8" stroke="#89aafb" stroke-width="1.5" />
  <text font-family="Noto Sans SC" fill="#1f2329" x="370" y="237" font-size="18" font-weight="600">Decision Scope / Gate</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="370" y="272" font-size="17">哪些动作在许可范围内</text>
  <rect font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#ffffff" x="656" y="198" width="220" height="100" rx="8" stroke="#7d8792" stroke-width="1.5" />
  <text font-family="Noto Sans SC" fill="#1f2329" x="676" y="237" font-size="21" font-weight="600">Quota / Frontier</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="676" y="272" font-size="17">预算与当前可推进工作</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="498" y="332" font-size="15">范围与前置条件</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="780" y="330" font-size="13">可用算力与工作面</text>
  <rect font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#1f2329" x="480" y="390" width="280" height="108" rx="12" />
  <text font-family="Noto Sans SC" fill="#ffffff" x="502" y="430" font-size="18" font-weight="600">Todo · Claim · Lease</text>
  <text font-family="Noto Sans SC" fill="#eeeeee" x="502" y="466" font-size="17">要做什么，谁负责，何时到期</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="784" y="422" font-size="15">受约束的一轮执行</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="960" y="364" font-size="14">执行边界</text>
  <rect font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#ffffff" x="962" y="386" width="192" height="108" rx="12" stroke="#7d8792" stroke-width="1.5" />
  <circle font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#f5f8ff" cx="992" cy="414" r="8" stroke="#89aafb" stroke-width="1.5" />
  <text font-family="Noto Sans SC" fill="#1f2329" x="1010" y="421" font-size="20" font-weight="600">Agent / Host</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="982" y="455" font-size="16">推理、工具与外部系统</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="982" y="480" font-size="15">提出结果与后续建议</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="948" y="555" font-size="13">观察 / Readback</text>
  <rect font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#f5f8ff" x="80" y="390" width="240" height="108" rx="54" stroke="#89aafb" stroke-width="1.5" />
  <text font-family="Noto Sans SC" fill="#1f2329" x="103" y="432" font-size="21" font-weight="600">Monitor / Replan</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="109" y="466" font-size="17">等新事实，调整后续工作</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="330" y="417" font-size="15">形成候选后继</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="82" y="524" font-size="15">等待或需要重规划</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="286" y="574" font-size="14">是 · 更新任务与归属</text>
  <rect font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#ffffff" x="480" y="604" width="280" height="112" rx="8" stroke="#7d8792" stroke-width="1.5" />
  <text font-family="Noto Sans SC" fill="#1f2329" x="502" y="644" font-size="18" font-weight="600">Evidence / Validation</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="502" y="680" font-size="17">把执行结果变成可核验的事实</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="365" y="641" font-size="15">经验证的提案</text>
  <polygon font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#f5f8ff" points="264,582 352,660 264,738 176,660" stroke="#89aafb" stroke-width="1.5" />
  <text font-family="Noto Sans SC" fill="#1f2329" x="264" y="645" text-anchor="middle" font-size="19" font-weight="600">迁移可接受？</text>
  <text font-family="Noto Sans SC" fill="#1f2329" x="264" y="677" text-anchor="middle" font-size="16">按域规则校验</text>
  <rect font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#ffffff" x="380" y="784" width="410" height="84" rx="8" stroke="#7d8792" stroke-width="1.5" />
  <text font-family="Noto Sans SC" fill="#1f2329" x="402" y="818" font-size="21" font-weight="600">Projection / Status / Attention</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="402" y="846" font-size="17">从事实生成当前状态与下一步注意事项</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="287" y="808" font-size="15">已接受的事实</text>
  <circle font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#ffffff" cx="1060" cy="704" r="28" stroke="#7d8792" stroke-width="1.5" />
  <circle font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="none" cx="1060" cy="697" r="7" stroke="#7d8792" stroke-width="1.5" />
  <path font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="none" d="M1048 715 Q1048 705 1060 705 Q1072 705 1072 715" stroke="#7d8792" stroke-width="1.5" />
  <text font-family="Noto Sans SC" fill="#1f2329" x="1122" y="765" text-anchor="middle" font-size="15" font-weight="600">人 / Agent</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="946" y="790" font-size="14">读取投影</text>
  <line font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#1f2329" x1="44" y1="936" x2="1156" y2="936" stroke="#ebebeb" />
  <text font-family="Noto Sans SC" fill="#1f2329" x="44" y="966" font-size="17" font-weight="600">控制面约束和记录行动；Agent 在合法空间内选择、推理与执行。</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="44" y="996" font-size="15">图示为职责与信息流；各域保留自己的状态所有权，不代表单一数据库、全局事务或固定调用顺序。</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="948" y="582" font-size="15">与迁移提案</text>
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="946" y="814" font-size="14">再作判断</text>
  <polyline points="176,660 140,660 140,700" fill="none" stroke="#77818d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="134,693 140,700 146,693" fill="none" stroke="#77818d" stroke-width="2" stroke-linejoin="round" />
  <rect x="76" y="700" width="132" height="50" rx="25" fill="#ffffff" stroke="#7d8792" stroke-width="1.5" />
  <text font-family="Noto Sans SC" font-size="15" fill="#4d4d4d" x="115" y="685">否</text>
  <text font-family="Noto Sans SC" font-size="16" fill="#4d4d4d" x="88" y="731">拒绝本次迁移</text>
  <text font-family="Noto Sans SC" font-size="14" fill="#4d4d4d" x="283" y="759">是 · 生成持久回执</text>
</svg>
