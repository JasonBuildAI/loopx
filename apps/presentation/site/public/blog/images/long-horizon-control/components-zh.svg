<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020">
  <title>Semantic Control Plane：把目标、边界与执行事实连成闭环</title>
  <desc>Goal 与验收定义方向，Decision Scope 和 Gate 限定动作范围，Quota 与 Frontier 限定预算和当前工作面。Todo、Claim 和 Lease 管理工作与归属。Agent 执行后，证据经校验形成状态迁移和回执；Monitor 与 Replan 据新事实调整后续工作；Projection 向人和 Agent 展示当前事实。</desc>
  <rect width="1200" height="1020" fill="#ffffff" />
  <text font-family="Noto Sans SC" fill="#64748b" x="44" y="48" font-size="14" letter-spacing="2">LOOPX · SEMANTIC CONTROL PLANE</text>
  <text font-family="Noto Sans SC" fill="#1f2329" x="44" y="96" font-size="32" font-weight="600">控制面把目标、边界与执行事实连成闭环</text>
  <rect font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#fafafa" x="36" y="136" width="880" height="764" rx="16" stroke="#b9bfc8" stroke-width="1.5" stroke-dasharray="7 6" />
  <rect font-family="Geist, Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#ffffff" x="940" y="336" width="232" height="180" rx="12" stroke="#b9bfc8" stroke-width="1.5" stroke-dasharray="5 5" />
  <text font-family="Noto Sans SC" fill="#4d4d4d" x="60" y="166" font-size="14" font-weight="600">持久控制面 · 跨会话保留工作与约束</text>
