<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">02  Read the current situation on one board</title>
<desc id="desc">A synthetic board: integration validation is claimed and has run evidence; release waits on a scoped Gate; implementation and review have results. The Goal is not complete. Columns are explanatory projections, not persisted state enums.</desc>
<g font-family="Geist, Inter, Helvetica Neue, Arial, sans-serif">
<rect x="0" y="0" width="1000" height="720" rx="0" fill="#fafafa" stroke="none"/>
<text x="40" y="49" font-size="28" fill="#171717" font-weight="600">02  Read the current situation on one board</text>
<text x="40" y="84" font-size="18" fill="#4d4d4d" font-weight="400">Goal · Ship bulk export safely    /    Missing: large-volume validation, release confirmation</text>
<rect x="40" y="112" width="292" height="414" rx="12" fill="#f2f2f2" stroke="#ebebeb"/>
<rect x="354" y="112" width="292" height="414" rx="12" fill="#f2f2f2" stroke="#ebebeb"/>
<rect x="668" y="112" width="292" height="414" rx="12" fill="#f2f2f2" stroke="#ebebeb"/>
<text x="60" y="148" font-size="22" fill="#171717" font-weight="600">Can proceed</text>
<text x="374" y="148" font-size="22" fill="#171717" font-weight="600">Awaiting decision</text>
<text x="688" y="148" font-size="22" fill="#171717" font-weight="600">Results available</text>
<rect x="52" y="170" width="268" height="222" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="70" y="202" font-size="21" fill="#171717" font-weight="600">C · Integration validation</text>
<text x="70" y="237" font-size="17" fill="#4d4d4d" font-weight="400">Owner: validation agent</text>
<text x="70" y="266" font-size="17" fill="#4d4d4d" font-weight="400">Claim: held</text>
<text x="70" y="295" font-size="17" fill="#4d4d4d" font-weight="400">Lease: valid (enabled here)</text>
<text x="70" y="324" font-size="17" fill="#4d4d4d" font-weight="400">Run: tests in progress</text>
<text x="70" y="353" font-size="17" fill="#4d4d4d" font-weight="400">Next: return result + evidence</text>
<rect x="52" y="408" width="268" height="100" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="70" y="439" font-size="19" fill="#171717" font-weight="600">Monitor · validation result</text>
<text x="70" y="463" font-size="16" fill="#4d4d4d" font-weight="400">Observe when due;</text>
<text x="70" y="486" font-size="16" fill="#4d4d4d" font-weight="400">quiet if unchanged</text>
<rect x="366" y="170" width="268" height="222" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="384" y="202" font-size="21" fill="#171717" font-weight="600">D · Release candidate</text>
<text x="384" y="237" font-size="17" fill="#4d4d4d" font-weight="400">Release Gate: unconfirmed</text>
<text x="384" y="266" font-size="17" fill="#4d4d4d" font-weight="400">Scope: release decision</text>
<text x="384" y="295" font-size="16" fill="#4d4d4d" font-weight="400">Prerequisite: acceptance passed</text>
<text x="384" y="324" font-size="17" fill="#4d4d4d" font-weight="400">Next: release when eligible</text>
<rect x="366" y="408" width="268" height="100" rx="12" fill="#f3f8ff" stroke="#b8d5fc"/>
<text x="384" y="438" font-size="17" fill="#0070f3" font-weight="600">Blocks only matching work</text>
<text x="384" y="468" font-size="15" fill="#4d4d4d" font-weight="400">Independent validation continues</text>
<rect x="680" y="170" width="268" height="156" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="698" y="202" font-size="21" fill="#171717" font-weight="600">A · Export implementation</text>
<text x="698" y="237" font-size="17" fill="#4d4d4d" font-weight="400">State: done · revision A</text>
<text x="698" y="265" font-size="17" fill="#4d4d4d" font-weight="400">Evidence: isolation test passed</text>
<text x="698" y="293" font-size="16" fill="#4d4d4d" font-weight="400">Successor: B independent review</text>
<rect x="680" y="342" width="268" height="166" rx="12" fill="#fff" stroke="#ebebeb"/>
<text x="698" y="375" font-size="21" fill="#171717" font-weight="600">B · Independent review</text>
<text x="698" y="410" font-size="17" fill="#4d4d4d" font-weight="400">Owner: review agent</text>
<text x="698" y="438" font-size="17" fill="#4d4d4d" font-weight="400">Evidence: revision A approved</text>
<text x="698" y="466" font-size="16" fill="#4d4d4d" font-weight="400">Successor: C integration test</text>
<text x="40" y="565" font-size="22" fill="#171717" font-weight="600">One Todo is presented by each agent's eligibility and responsibility.</text>
<text x="40" y="601" font-size="18" fill="#4d4d4d" font-weight="400">Column names explain; they are not persisted states. Claimed is not running; execution needs evidence.</text>
<text x="40" y="631" font-size="18" fill="#4d4d4d" font-weight="400">One completed card does not mean the Goal has been accepted.</text>
<text x="40" y="691" font-size="15" fill="#4d4d4d" font-weight="400">LOOPX  /  KANBAN FOUNDATIONS · SYNTHETIC EXAMPLE</text>
</g>
</svg>
